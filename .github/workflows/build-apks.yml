name: Build & Release Parallel APKs (Truyền & Nhận)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: Transmitter
            task: assembleTransmitterRelease
            apk_dir: android/app/build/outputs/apk/transmitter/release
            release_name: MusicToBlutooth-Truyen.apk
          - flavor: Receiver
            task: assembleReceiverRelease
            apk_dir: android/app/build/outputs/apk/receiver/release
            release_name: MusicToBlutooth-Nhan.apk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build ${{ matrix.flavor }} Release APK
        working-directory: android
        run: gradle :app:${{ matrix.task }} --no-daemon --stacktrace

      - name: Locate & Rename APK output
        run: |
          APK_FILE=$(find "${{ matrix.apk_dir }}" -maxdepth 2 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Không tìm thấy tệp APK trong ${{ matrix.apk_dir }}"
            exit 1
          fi
          cp "$APK_FILE" "${{ matrix.release_name }}"
          ls -lh "${{ matrix.release_name }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_name }}
          path: ${{ matrix.release_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-apk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download Transmitter APK
        uses: actions/download-artifact@v4
        with:
          name: MusicToBlutooth-Truyen.apk
          path: release-assets

      - name: Download Receiver APK
        uses: actions/download-artifact@v4
        with:
          name: MusicToBlutooth-Nhan.apk
          path: release-assets

      - name: Create Release & Attach APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: MusicToBlutooth ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/MusicToBlutooth-Truyen.apk
            release-assets/MusicToBlutooth-Nhan.apk
