name: Build & Release Parallel APKs (Truyền & Nhận)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: Transmitter
            task: assembleTransmitterRelease
            apk_dir: android/app/build/outputs/apk/transmitter/release
            release_name: MusicToBlutooth-Truyen.apk
          - flavor: Receiver
            task: assembleReceiverRelease
            apk_dir: android/app/build/outputs/apk/receiver/release
            release_name: MusicToBlutooth-Nhan.apk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web Assets into Android APK
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps
            npm run build
            rm -rf android/app/src/main/assets/www
            mkdir -p android/app/src/main/assets/www
            cp -r dist/* android/app/src/main/assets/www/
          fi
          if [ ! -f "android/app/src/main/assets/www/index.html" ]; then
            echo "Thiếu tệp web assets trong android/app/src/main/assets/www/index.html"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > android/local.properties
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build ${{ matrix.flavor }} Release APK
        working-directory: android
        run: gradle :app:${{ matrix.task }} --no-daemon --stacktrace

      - name: Locate & Rename APK output
        run: |
          APK_FILE=$(find "${{ matrix.apk_dir }}" -maxdepth 2 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Không tìm thấy tệp APK trong ${{ matrix.apk_dir }}"
            exit 1
          fi
          cp "$APK_FILE" "${{ matrix.release_name }}"
          ls -lh "${{ matrix.release_name }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_name }}
          path: ${{ matrix.release_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-apk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download Transmitter APK
        uses: actions/download-artifact@v4
        with:
          name: MusicToBlutooth-Truyen.apk
          path: release-assets

      - name: Download Receiver APK
        uses: actions/download-artifact@v4
        with:
          name: MusicToBlutooth-Nhan.apk
          path: release-assets

      - name: Create Release & Attach APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: MusicToBlutooth ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/MusicToBlutooth-Truyen.apk
            release-assets/MusicToBlutooth-Nhan.apk
